# Recipe Hub — Contabo Nginx
# App listens on 127.0.0.1:3013. Nginx serves 80 (and 443 after certbot).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/api.recipehubapp.com
#   sudo ln -sf /etc/nginx/sites-available/api.recipehubapp.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $recipehub_upgrade {
    default upgrade;
    ""      close;
}

upstream recipehub_node {
    server 127.0.0.1:3013;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.recipehubapp.com;

    client_max_body_size 20m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://recipehub_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $recipehub_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
